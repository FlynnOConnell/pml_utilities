[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pml_utilities"
version = "3.3.4"
description = "A fork of mbo_utilities for Program in Memory Longevity (PML)"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12.7,<3.14"
keywords = ["Microscopy", "ScanImage", "multiROI", "Tiff"]
dependencies = [
	"setuptools<81",
	"click",
	"numpy>=2.2.5,<2.4",
	"pandas",
	"scipy",
	"tifffile>=2025.3.30",
	"scikit-image",
	"zarr>=3.1.3",
	"dask>=2025.3.0",
	"imageio[ffmpeg]",
	"ffmpeg-python",
	"matplotlib>=3.10.1",
	"cmap>=0.7.2",
	"opencv-contrib-python-headless",
	"h5py",
	"psutil>=7.0",
	"tqdm",
	"icecream>=2.1.4",
	"glfw",
	"pyqt6>=6.7 ; sys_platform == 'linux'",
	"pyqt6-sip ; sys_platform == 'linux'",
	"pygfx>=0.15.2",
	"llvmlite>=0.43.0",
	"numba>=0.60.0",
	"fastplotlib",
	"rendercanvas>=2.7.2",
	"uvicorn>=0.30",
	"websockets>=13",
	"imgui-bundle>=1.92.801,<1.92.900",
	"imgui_debugger>=0.2,<0.3",
	"wgpu>=0.28.1",
	"submitit>=1.5.0",
	"imagecodecs>=2026.6.6",
]

[project.scripts]
mbo = "mbo_utilities.cli:main"
pollen = "pollen.pollen_calibration_mbo:main"

[project.entry-points."mbo_utilities.lazy_arrays"]
lbm = "mbo_utilities.arrays.tiff:LBMArray"
lbm_piezo = "mbo_utilities.arrays.tiff:LBMPiezoArray"
piezo = "mbo_utilities.arrays.tiff:PiezoArray"
single_plane = "mbo_utilities.arrays.tiff:SinglePlaneArray"
scanimage = "mbo_utilities.arrays.tiff:ScanImageArray"
tiff = "mbo_utilities.arrays.tiff:TiffArray"
zarr = "mbo_utilities.arrays.zarr:ZarrArray"
suite2p = "mbo_utilities.arrays.suite2p:Suite2pArray"
h5 = "mbo_utilities.arrays.h5:H5Array"
mesc = "mbo_utilities.arrays.mesc:MescArray"
results = "mbo_utilities.results:ResultsArray"
demixing = "mbo_utilities.arrays.demixing:DemixingArray"
numpy = "mbo_utilities.arrays.numpy:NumpyArray"
isoview = "mbo_utilities.arrays.isoview.array:IsoviewArray"

[project.entry-points."mbo_utilities.pipelines"]
rois = "mbo_utilities.gui.widgets.pipelines.rois:RoiPipelineWidget"

[project.urls]
Homepage = "https://github.com/millerbrainobservatory/mbo_utilities"
Documentation = "https://millerbrainobservatory.github.io/mbo_utilities/index.html"
Repository = "https://github.com/FlynnOConnell/pml_utilities"
Issues = "https://github.com/MillerBrainObservatory/mbo_utilities/issues"

[project.optional-dependencies]
napari = [
    "napari",
    "napari-ome-zarr",
    "napari-animation",
    "pyqt6>=6.7",
    "qtpy",
]
notebooks = [
    "jupyterlab>=4.2.6",
    "ipykernel",
    "ipywidgets>=8.0.0,<9",
    "jupyter_rfb>=0.5.1",
    "seaborn>=0.13.2",
]
docs = [
    "sphinx>=6.1.3",
    "docutils>=0.19",
    "nbsphinx",
    "numpydoc",
    "ipykernel",
    "sphinx-autodoc2",
    "sphinx_tippy",
    "sphinx_gallery",
    "sphinx-togglebutton",
    "sphinx-copybutton",
    "sphinx_book_theme",
    "sphinx_design",
    "sphinxcontrib-images",
    "sphinxcontrib-video",
    "sphinxcontrib-bibtex",
    "jupytext",
    "myst_nb",
    "pygfx>=0.14.0",
]
all = ["pml_utilities[napari,notebooks]"]

[tool.uv.sources]
# imgui_debugger is not on PyPI yet; resolve it from the sibling checkout
imgui_debugger = { path = "../imgui_debugger", editable = true }

[tool.uv]
default-groups = ["dev", "suite2p", "napari", "notebooks", "docs"]
override-dependencies = [
	"mbo-utilities ; python_version < '0'",
	"scanimage-tiff-reader ; python_version < '0'",
	"opencv-python-headless ; python_version < '0'",
]

[tool.ruff]
line-length = 88
src = ["mbo_utilities", "pollen"]
extend-exclude = [
    "*.ipynb",
    "docs",
    "demos",
    "scripts",
    "dev",
    "processing",
    "benchmarks",
    "gists",
    "slurm",
]

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import grouping: stdlib, third-party, mbo_utilities
    "TID",  # absolute imports inside the package
    "UP",   # pyupgrade
    "PTH",  # pathlib.Path, never os.path
    "ERA",  # commented-out code
    "D",    # numpy docstrings
    "Q",    # quotes, matches ruff format
]
ignore = [
    "E501",  # ruff format wraps code; long strings and comments remain (AGENTS.md §15)
    "D1",    # docstrings are optional (STYLE.md)
    "D205",  # blank line after summary; enable after the §15 sweep
    "D400",  # trailing period on summary; enable after the §15 sweep
    "D401",  # imperative mood
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["mbo_utilities*", "pollen*"]
exclude = ["dev*", "gists*", "demos*", "assets*", "docs*", "tests*"]

[tool.setuptools.package-data]
mbo_utilities = ["assets/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["data/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()"
]

[dependency-groups]
napari = [
    "napari",
    "napari-ome-zarr",
    "napari-animation",
    "pyqt6>=6.7",
    "qtpy",
]
notebooks = [
    "jupyterlab>=4.2.6",
    "ipykernel",
    "ipywidgets>=8.0.0,<9",
    "jupyter_rfb>=0.5.1",
    "seaborn>=0.13.2",
]
docs = [
    "sphinx>=6.1.3",
    "docutils>=0.19",
    "nbsphinx",
    "numpydoc",
    "ipykernel",
    "sphinx-autodoc2",
    "sphinx_tippy",
    "sphinx_gallery",
    "sphinx-togglebutton",
    "sphinx-copybutton",
    "sphinx_book_theme",
    "sphinx_design",
    "sphinxcontrib-images",
    "sphinxcontrib-video",
    "sphinxcontrib-bibtex",
    "jupytext",
    "myst_nb",
]
dev = [
    "graphviz>=0.21",
    "pillow>=12.1.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pytest>=8.4.2",
]
suite2p = [
    "lbm-suite2p-python[rastermap]>=3.3.2",
    "suite2p>=1.1.0",
    "rastermap>=0.9",
]
