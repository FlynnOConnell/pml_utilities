# ruff format and fix on every merge request into main, committed to the
# request's source branch, so main only ever receives formatted code and no
# bot commit lands on main itself. GitHub is a push mirror of this project
# (Settings > Repository > Mirroring repositories), so it gets every push made
# here, the bot's included. A request from a fork is only checked.
# Needs one masked CI variable (Settings > CI/CD > Variables):
#   GITLAB_PUSH_TOKEN  project access token, role Maintainer, scope write_repository

format:
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
  script:
    - pip install --quiet ruff==0.14.10
    - ruff format .
    - ruff check --fix --exit-zero .
    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "already formatted"
      elif [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; then
        echo "request from a fork: run ruff format and ruff check --fix on the branch"
        exit 1
      else
        git config user.name "gitlab-ci"
        git config user.email "gitlab-ci@users.noreply.gitlab.com"
        git checkout -B "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        git commit -m "ruff format and fix"
        git push -o ci.skip "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      fi
    - ruff check . || true
