name: Format

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# GitHub is a push mirror of the GitLab project, where merge requests are
# formatted (.gitlab-ci.yml). Anything committed here is overwritten by the
# next mirror update, so this only checks.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check formatting
        run: uv tool run ruff@0.14.10 format --check .

      - name: Report remaining violations
        run: uv tool run ruff@0.14.10 check .
