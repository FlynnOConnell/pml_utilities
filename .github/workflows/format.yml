name: Format

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Format and fix
        run: |
          uv tool run ruff@0.14.10 format .
          uv tool run ruff@0.14.10 check --fix --exit-zero .

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ruff format and fix"
          git push

      - name: Report remaining violations
        run: uv tool run ruff@0.14.10 check .
