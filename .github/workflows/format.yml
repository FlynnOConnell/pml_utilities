name: Format

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# formatting is committed by the GitLab pipeline (.gitlab-ci.yml), which pushes
# the result here as well; this workflow only reports
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check formatting
        run: uv tool run ruff@0.14.10 format --check .

      - name: Report remaining violations
        run: uv tool run ruff@0.14.10 check .
